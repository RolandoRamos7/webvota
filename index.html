<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Votación</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#e9e9e9;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* HEADER */
    .topbar{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:10px 40px;
    }

    .logo{
      width:180px;
    }

    .right-section{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
    }

    .guide-text{
      font-size:18px;
      color:#000;
      margin-top:10px;
    }

    .small-logo{
      width:70px;
    }

    /* MAIN CONTENT */
    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      margin-top:-40px;
    }

    .machine{
      width:320px;
      margin-bottom:30px;
    }

    .title{
      font-size:48px;
      color:#000;
      font-weight:400;
      margin-bottom:120px;
    }

    /* BUTTON */
    .btn-start{
      background:#5cb85c;
      color:#fff;
      border:none;
      padding:18px 70px;
      font-size:22px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn-start:hover{
      background:#4cae4c;
    }

    /* RESPONSIVE */
    @media(max-width:768px){

      .topbar{
        flex-direction:column;
        align-items:center;
        gap:20px;
      }

      .title{
        font-size:34px;
        padding:0 20px;
      }

      .machine{
        width:240px;
      }

      .btn-start{
        padding:15px 50px;
        font-size:20px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->

  <!-- MAIN -->
  <main class="main">

    <!-- Imagen máquina -->
    <img 
      class="machine"
      src="https://simuladoroficial.tsje.gov.py/img/maquina0_p6.png"
      alt="Máquina de votación"
    >

    <!-- Texto principal -->
    <h1 class="title">
      Simulador del uso de la máquina de votación.
    </h1>

    <!-- Botón -->
    <button onclick="window.location.href='comezar.html'" class="btn-start">
      Comenzar
    </button>

  </main>

</body>
</html>
