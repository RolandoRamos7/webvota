<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opciones seleccionadas</title>


<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    background: #292929;

    font-family: Arial, Helvetica, sans-serif;

}


/* =========================================================
   PANTALLA
   ========================================================= */

.pantalla {

    width: 1060px;

    height: 100vh;

    min-height: 598px;

    margin: 0 auto;

    background: #d2d2d2;

    overflow: hidden;

    display: flex;

    flex-direction: column;

}


/* =========================================================
   ENCABEZADO
   ========================================================= */

.barra-superior {

    width: 100%;

    height: 47px;

    flex-shrink: 0;

    background: #d2d2d2;

    display: flex;

    align-items: flex-start;

}


/* =========================================================
   LOGO IZQUIERDO
   ========================================================= */

.logo-izquierdo {

    width: 135px;

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

}

.logo-izquierdo img {

    width: 103px;

    height: 39px;

    object-fit: contain;

}


/* =========================================================
   INFORMACIÓN
   ========================================================= */

.informacion {

    width: 860px;

    height: 47px;

    position: relative;

}


/* TEXTO SUPERIOR */

.datos-eleccion {

    position: absolute;

    top: 2px;

    left: 0;

    width: 100%;

    height: 13px;

    color: #000;

    font-size: 8px;

    font-weight: bold;

    white-space: nowrap;

}


/* =========================================================
   TÍTULO
   ========================================================= */

.titulo {

    position: absolute;

    top: 20px;

    left: 0;

    width: 725px;

    height: 25px;

    background: #5c6060;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    font-weight: bold;

}


/* =========================================================
   LOGO DERECHO
   ========================================================= */

.logo-derecho {

    width: 65px;

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

}

.logo-derecho img {

    width: 38px;

    height: 38px;

    object-fit: contain;

}


/* =========================================================
   CONTENIDO PRINCIPAL
   ========================================================= */

.contenido {

    flex: 1;

    min-height: 0;

    padding: 3px 0 5px 5px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr)
        108px;

    gap: 5px;

}


/* =========================================================
   TARJETAS DE SELECCIÓN
   ========================================================= */

.seleccion {

    height: 100%;

    background: #ff0505;

    border: 1px solid #aaa;

    color: white;

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    overflow: hidden;

}


/* =========================================================
   TÍTULO DE CADA SECCIÓN
   ========================================================= */

.titulo-seccion {

    width: calc(100% - 10px);

    height: 36px;

    border-bottom: 1px solid #990000;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;

    font-weight: bold;

}


/* =========================================================
   PARTIDO
   ========================================================= */

.nombre-partido {

    margin-top: 20px;

    font-size: 24px;

    font-weight: bold;

}


/* =========================================================
   LISTA
   ========================================================= */

.numero-lista {

    margin-top: 31px;

    font-size: 24px;

    font-weight: bold;

}


/* =========================================================
   FOTO DEL CANDIDATO
   ========================================================= */

.foto-seleccion {

    width: 120px;

    height: 120px;

    margin-top: 17px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


/* IMAGEN */

.foto-seleccion img {

    width: 100%;

    height: 100%;

    object-fit: contain;

}


/* =========================================================
   NOMBRE
   ========================================================= */

.nombre-seleccion {

    margin-top: 45px;

    font-size: 23px;

    font-weight: bold;

}


/* =========================================================
   OPCIÓN
   ========================================================= */

.opcion-seleccion {

    margin-top: 5px;

    font-size: 23px;

    font-weight: normal;

}


/* =========================================================
   BOTÓN MODIFICAR
   ========================================================= */

.boton-modificar {

    position: absolute;

    bottom: 5px;

    left: 50%;

    transform: translateX(-50%);

    width: 130px;

    height: 45px;

    border: none;

    border-radius: 5px;

    background: #d3d3d3;

    color: #000;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

}


/* EFECTO */

.boton-modificar:hover {

    background: #eeeeee;

}

.boton-modificar:active {

    transform: translateX(-50%) scale(0.97);

}


/* =========================================================
   COLUMNA DERECHA
   ========================================================= */

.acciones {

    height: 100%;

    display: flex;

    flex-direction: column;

    gap: 5px;

}


/* =========================================================
   BOTÓN REINICIAR
   ========================================================= */

.reiniciar {

    flex: 0 0 132px;

    background: #ff7900;

    border: 1px solid #aaa;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    text-align: center;

}


.icono-reiniciar {

    font-size: 47px;

    line-height: 42px;

    font-weight: bold;

}


.texto-reiniciar {

    margin-top: 5px;

    font-size: 16px;

    line-height: 17px;

    font-weight: bold;

}


/* =========================================================
   BOTÓN IMPRIMIR
   ========================================================= */

.imprimir {

    flex: 1;

    background: #00a000;

    border: 1px solid #aaa;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    text-align: center;

}


.icono-imprimir {

    font-size: 46px;

    line-height: 45px;

}


.texto-imprimir {

    margin-top: 7px;

    font-size: 16px;

    line-height: 17px;

    font-weight: bold;

}


/* =========================================================
   HOVER ACCIONES
   ========================================================= */

.reiniciar:hover {

    filter: brightness(0.95);

}

.imprimir:hover {

    filter: brightness(0.95);

}


/* =========================================================
   BARRA INFERIOR
   ========================================================= */

.barra-inferior {

    width: 100%;

    height: 10px;

    flex-shrink: 0;

    background: #cccccc;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1060px) {

    .pantalla {

        width: 100%;

        height: 100vh;

        min-height: 598px;

        margin: 0;

    }

    .informacion {

        width: calc(100% - 200px);

    }

    .titulo {

        width: 84%;

    }

}


/* =========================================================
   PANTALLAS PEQUEÑAS
   ========================================================= */

@media (max-width: 700px) {

    .contenido {

        grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 1fr)
            80px;

        gap: 3px;

        padding-left: 3px;

    }


    .nombre-partido {

        font-size: 15px;

    }


    .numero-lista {

        font-size: 17px;

        margin-top: 20px;

    }


    .foto-seleccion {

        width: 80px;

        height: 80px;

    }


    .nombre-seleccion {

        font-size: 15px;

        margin-top: 25px;

    }


    .opcion-seleccion {

        font-size: 15px;

    }


    .titulo-seccion {

        font-size: 14px;

    }


    .boton-modificar {

        width: 95px;

        height: 35px;

        font-size: 14px;

    }


    .texto-reiniciar,
    .texto-imprimir {

        font-size: 11px;

    }


    .icono-reiniciar,
    .icono-imprimir {

        font-size: 32px;

    }

}

</style>

</head>


<body>


<div class="pantalla">


    <!-- =====================================================
         ENCABEZADO
         ===================================================== -->

    <div class="barra-superior">


        <!-- LOGO IZQUIERDO -->

        <div class="logo-izquierdo">

            <img
                src="https://simuladoroficial.tsje.gov.py/img/paraguay/logo_eleccion.png"
                alt="Elecciones Paraguay">

        </div>


        <!-- INFORMACIÓN -->

        <div class="informacion">


            <div class="datos-eleccion">

                Elección:
                &nbsp; ELECCIONES MUNICIPALES

                &nbsp;&nbsp;

                Departamento:
                &nbsp; 8-MISIONES

                &nbsp;&nbsp;

                Distrito:
                &nbsp; 1-AYOLAS

                &nbsp;&nbsp;

                Zona:

                &nbsp;&nbsp;&nbsp;&nbsp;

                Local:

            </div>


            <div class="titulo">

                Opciones seleccionadas

            </div>


        </div>


        <!-- LOGO DERECHO -->

        <div class="logo-derecho">

            <img
                src="https://simuladoroficial.tsje.gov.py/img/paraguay/logo_votar.png"
                alt="Logo">

        </div>


    </div>



    <!-- =====================================================
         CONTENIDO
         ===================================================== -->

    <div class="contenido">


        <!-- =================================================
             INTENDENTE MUNICIPAL
             ================================================= -->

        <div class="seleccion">


            <div class="titulo-seccion">

                INTENDENTE MUNICIPAL

            </div>


            <div class="nombre-partido">

                PARTIDO COLORADO

            </div>


            <div class="numero-lista">

                LISTA 1

            </div>


            <div class="foto-seleccion">

                <img
                    src="https://simuladoroficial.tsje.gov.py/imagenes_candidaturas/paraguay_generales_municipales_2026/756.4952.webp"
                    alt="Capitan Mutti">

            </div>


            <div class="nombre-seleccion">

                CAPITAN MUTTI

            </div>


            <button
                class="boton-modificar"
                onclick="window.location.href='index.html'"
            >

                Modificar

            </button>


        </div>



        <!-- =================================================
             JUNTA MUNICIPAL
             ================================================= -->

        <div class="seleccion">


            <div class="titulo-seccion">

                JUNTA MUNICIPAL

            </div>


            <div class="nombre-partido">

                PARTIDO COLORADO

            </div>


            <div class="numero-lista">

                LISTA 1

            </div>


            <div class="foto-seleccion">

                <img
                    src="https://simuladoroficial.tsje.gov.py/imagenes_candidaturas/paraguay_generales_municipales_2026/759.4958.webp"
                    alt="Dra. Talavera">

            </div>


            <div class="nombre-seleccion">

                DRA. TALAVERA

            </div>


            <div class="opcion-seleccion">

                Opción 4

            </div>


            <button
                class="boton-modificar"
                onclick="window.location.href='p5.html'"
            >

                Modificar

            </button>


        </div>



        <!-- =================================================
             ACCIONES
             ================================================= -->

        <div class="acciones">


            <!-- REINICIAR -->

            <div
                class="reiniciar"
                onclick="reiniciarSeleccion()"
            >


                <div class="icono-reiniciar">

                    ⟳

                </div>


                <div class="texto-reiniciar">

                    Reiniciar<br>
                    Selección

                </div>


            </div>



            <!-- IMPRIMIR -->

            <div
                class="imprimir"
                onclick="window.print()"
            >


                <div class="icono-imprimir">

                    🖨

                </div>


                <div class="texto-imprimir">

                    Imprimir<br>
                    Selección

                </div>


            </div>


        </div>


    </div>



    <!-- BARRA INFERIOR -->

    <div class="barra-inferior"></div>


</div>



<script>

/* =========================================================
   REINICIAR SELECCIÓN
   ========================================================= */

function reiniciarSeleccion() {

    window.location.href = "index.html";

}

</script>


</body>

</html>
