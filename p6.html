<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opciones Seleccionadas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#2b2b2b;
    overflow:hidden;
}

/* PANTALLA */
.pantalla{

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* TABLERO */
.tablero{

    width:100vw;

    background:#dcdcdc;

    border:2px solid #8a8a8a;
}

/* BARRA SUPERIOR */
.superior{

    background:#5a5a5a;

    color:white;

    text-align:center;

    font-size:10px;

    font-weight:bold;

    padding:5px;
}

/* CONTENIDO */
.contenido{

    display:grid;

    grid-template-columns:1fr 1fr 100px;

    gap:3px;

    padding:3px;
}

/* TARJETAS */
.card{

    background:#efefef;

    border:1px solid #c5c5c5;

    text-align:center;

    padding:10px;

    min-height:320px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;
}

/* TITULOS */
.titulo{

    font-size:18px;

    font-weight:bold;

    border-bottom:1px solid #999;

    padding-bottom:5px;
}

.partido{

    font-size:22px;

    font-weight:bold;

    margin-top:15px;
}

.lista{

    font-size:26px;

    font-weight:bold;

    margin-top:20px;
}

/* IMAGEN */
.card img{

    width:90px;

    height:90px;

    object-fit:cover;

    margin:auto;
}

/* NOMBRE */
.nombre{

    font-size:20px;

    font-weight:bold;
}

.opcion{

    font-size:18px;
}

/* BOTON */

.boton{

    background:#5b5b5b;

    color:white;

    text-decoration:none;

    padding:10px;

    border-radius:4px;

    width:120px;

    margin:auto;

    font-weight:bold;
}

/* LATERAL */
.lateral{

    display:flex;

    flex-direction:column;

    gap:3px;
}

/* BOTONES LATERALES */

.side-buttons{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.side-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#fff;
    text-align:center;
    font-weight:bold;
    padding:20px 10px;
}

.orange{
    background:#ff7b00;
}

.green{
    background:#00b100;
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

.side-text{
    font-size:20px;
    line-height:1.1;
}


/* RESPONSIVE */
@media(max-width:768px){

    .contenido{

        grid-template-columns:1fr 1fr 70px;
    }

    .card{

        min-height:220px;

        padding:6px;
    }

    .titulo{

        font-size:11px;
    }

    .partido{

        font-size:14px;
    }

    .lista{

        font-size:16px;
    }

    .card img{

        width:55px;

        height:55px;
    }

    .nombre{

        font-size:10px;
    }

    .opcion{

        font-size:8px;
    }

    .boton{

        width:80px;

        padding:6px;

        font-size:10px;
    }

    .side{

        font-size:8px;
    }

    .superior{

        font-size:7px;

        padding:3px;
    }

}

</style>
</head>

<body>

<div class="pantalla">

    <div class="tablero">

        <div class="superior">
            Opciones seleccionadas
        </div>

        <div class="contenido">

            <!-- INTENDENTE -->
            <div class="card">

                <div class="titulo">
                    INTENDENTE MUNICIPAL
                </div>

                <div class="partido">
                    HONOR COLORADO
                </div>

                <div class="lista">
                    LISTA 2
                </div>

                <img src="https://simuladoroficial.tsje.gov.py/imagenes_candidaturas/paraguay_internas_municipales_2026/3878.25858.webp" alt="">

                <div class="nombre">
                    Christian Rolon
                </div>

                <a href="index.html" class="boton">
                    Modificar
                </a>

            </div>

            <!-- JUNTA -->
            <div class="card">

                <div class="titulo">
                    JUNTA MUNICIPAL
                </div>

                <div class="partido">
                    HONOR COLORADO A
                </div>

                <div class="lista">
                    LISTA 2A
                </div>

                <img src="https://simuladoroficial.tsje.gov.py/imagenes_candidaturas/paraguay_internas_municipales_2026/3881.25865.webp" alt="">

                <div>

                    <div class="nombre">
                        Dra. Talavera
                    </div>

                    <div class="opcion">
                        Opción 5
                    </div>

                </div>

                <a href="p5.html" class="boton">
                    Modificar
                </a>

            </div>

            <!-- BOTONES LATERALES -->
        <div class="side-buttons">

            <div class="side-btn orange" onclick="window.location.href='p3.html'">
                <div class="icon">↻</div>
                <div class="side-text">
                    Reiniciar<br>Seleccion
                </div>
            </div>

            <div class="side-btn green" onclick="window.location.href='p7.html'">
                <div class="icon">🖨</div>
                <div class="side-text">
                    Imprimir<br>Seleccion
                </div>
            </div>

        </div>

    </div>
    </div>

</div>

</body>
</html>
