<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guía Rápida para Votar</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#e9e9e9;
      width:100%;
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* HEADER */
    .header{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:10px 40px;
    }

    .logo-left img{
      width:190px;
    }

    .header-center{
      text-align:center;
      margin-top:10px;
      font-size:20px;
      color:#000;
    }

    .logo-right img{
      width:70px;
    }

    /* CONTENIDO */
    .container{
      width:100%;
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .imagen-central{
      width:430px;
      margin-bottom:30px;
    }

    .texto{
      width:70%;
      text-align:center;
      font-size:28px;
      line-height:1.2;
      color:#000;
      margin-bottom:70px;
    }

    .texto strong{
      font-weight:bold;
    }

    /* BOTON */
    .btn{
      background:#3d7fbd;
      color:white;
      border:none;
      padding:18px 40px;
      font-size:20px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#2f6aa0;
    }

    @media(max-width:900px){

      .texto{
        width:90%;
        font-size:22px;
      }

      .imagen-central{
        width:320px;
      }

      .header-center{
        font-size:16px;
      }

      .logo-left img{
        width:140px;
      }

      .logo-right img{
        width:50px;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">

    <div class="logo-left">
      <img src="https://simuladoroficial.tsje.gov.py/img/logo_eleccion.png" alt="Logo Elecciones">
    </div>

    <div class="header-center">
      GUÍA RÁPIDA PARA VOTAR EN LA MÁQUINA DE VOTACIÓN
    </div>

    <div class="logo-right">
      <img src="https://simuladoroficial.tsje.gov.py/img/header.png" alt="Logo">
    </div>

  </div>

  <!-- CONTENIDO -->
  <div class="container">

    <img 
      class="imagen-central"
      src="https://simuladoroficial.tsje.gov.py/img/info_tinta.png"
      alt="Proceso de votación"
    >

    <div class="texto">
      <strong>Entintate</strong> el dedo índice de la mano derecha.
      Recibí del presidente de mesa el boletín y
      <strong>depositalo</strong> en la urna plástica.
      Retirá tu cédula de identidad civil.
    </div>

     <button class="btn" onclick="window.location.href='index.html'">
      Continuar
    </button>

  </div>

</body>
</html>
