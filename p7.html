<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Título de la Página</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#e9e9e9;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* =========================
       HEADER
    ========================== */

    .topbar{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:10px 40px;
    }

    .logo{
      width:180px;
    }

    .right-section{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
    }

    .guide-text{
      font-size:18px;
      color:#000;
      margin-top:10px;
    }

    .small-logo{
      width:70px;
    }

    /* =========================
       BODY CONTENT
    ========================== */

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    /* =========================
       BOTONES
    ========================== */

    .btn{
      background:#3279b8;
      color:#fff;
      border:none;
      padding:18px 55px;
      font-size:22px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#245d8f;
    }

    .btn-green{
      background:#5cb85c;
    }

    .btn-green:hover{
      background:#4cae4c;
    }

    /* =========================
       TEXTOS
    ========================== */

    .text{
      width:80%;
      text-align:center;
      font-size:30px;
      line-height:1.2;
      color:#000;
    }

    .text strong{
      font-weight:900;
    }

    /* =========================
       IMÁGENES
    ========================== */

    .image{
      width:320px;
      max-width:90%;
      margin-bottom:30px;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:768px){

      .topbar{
        flex-direction:column;
        align-items:center;
        gap:20px;
      }

      .guide-text{
        font-size:15px;
        text-align:center;
      }

      .text{
        width:95%;
        font-size:22px;
      }

      .image{
        width:240px;
      }

      .btn{
        padding:15px 40px;
        font-size:18px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <!-- Logo izquierda -->
    <img 
      class="logo"
      src="https://simuladoroficial.tsje.gov.py/img/logo_eleccion.png"
      alt="Logo elecciones"
    >

    <!-- Texto y logo derecha -->
    <div class="right-section">

      <div class="guide-text">
        GUÍA RÁPIDA PARA VOTAR EN LA MÁQUINA DE VOTACIÓN
      </div>

      <img 
        class="small-logo"
        src="https://simuladoroficial.tsje.gov.py/img/header.png"
        alt="Logo"
      >

    </div>

  </header>

  <!-- =========================
       BODY (CAMBIAR SOLO ESTO)
  ========================== -->

  <main class="main">

    <!-- EJEMPLO -->

    <img 
      class="image"
      src="https://simuladoroficial.tsje.gov.py/img/maquina0_p6.png"
      alt="Imagen"
    >

   <div class="text">
            Una vez impreso el boletín,
            <strong>verificá</strong> que el registro electrónico de tu voto,
            coincida con la versión impresa, acercando el boletín al lector verificador.
        </div>
    <br><br>

    <button class="btn" onclick="window.location.href='p8.html'">
      Continuar
    </button>

  </main>

</body>
</html>
