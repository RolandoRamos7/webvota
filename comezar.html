<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Votación</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#e9e9e9;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* HEADER */
    .topbar{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:10px 40px;
    }

    .logo{
      width:180px;
    }

    .right-section{
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
    }

    .guide-text{
      font-size:18px;
      color:#000;
      margin-top:10px;
    }

    .small-logo{
      width:70px;
    }

    /* MAIN CONTENT */
    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      margin-top:-40px;
    }

    .machine{
      width:320px;
      margin-bottom:30px;
    }

    .title{
      font-size:48px;
      color:#000;
      font-weight:400;
      margin-bottom:120px;
    }

    /* BUTTON */
    btn{
      background:#3279b8;
      color:#fff;
      border:none;
      padding:18px 55px;
      font-size:22px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

 

    .btn:hover{
      background:#245d8f;
    }

    .btn-green{
      background:#5cb85c;
    }

    .btn-green:hover{
      background:#4cae4c;
    }

  
    /* RESPONSIVE */
    @media(max-width:768px){

      .topbar{
        flex-direction:column;
        align-items:center;
        gap:20px;
      }

      .title{
        font-size:34px;
        padding:0 20px;
      }

      .machine{
        width:240px;
      }

      .btn-start{
        padding:15px 50px;
        font-size:20px;
      }
    }
  </style>
</head>
 <!-- HEADER -->
  <header class="topbar">

    <!-- Logo izquierda -->
    <img 
      class="logo"
      src="https://simuladoroficial.tsje.gov.py/img/logo_eleccion.png"
      alt="Logo elecciones"
    >

    <!-- Texto y logo derecha -->
    <div class="right-section">

      <div class="guide-text">
        GUÍA RÁPIDA PARA VOTAR EN LA MÁQUINA DE VOTACIÓN
      </div>

      <img 
        class="small-logo"
        src="https://simuladoroficial.tsje.gov.py/img/header.png"
        alt="Logo"
      >

    </div>

  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- Imagen máquina -->
    <img 
      class="machine"
      src="https://simuladoroficial.tsje.gov.py/img/boleta-troquel.png"
      alt="Máquina de votación"
    >

    <!-- Texto principal -->
 
   <div class="text">
          Presentá tu cédula de identidad civil a los miembros de la mesa receptora de votos, quienes te entregarán el boletín firmado por los dos vocales.
        </div>
    <!-- Botón -->
    <button onclick="window.location.href='p3.html'" class="btn">
      Continuar
    </button>

  </main>
</html>
