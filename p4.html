<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listas Participantes</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#2d2d2d;
    }

    .contenedor{
        width: 1100px;
        margin: 20px auto;
        background:#dcdcdc;
        padding:10px;
    }

    .titulo{
        text-align:center;
        font-size:28px;
        font-weight:bold;
        margin-bottom:10px;
    }

    .grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap:8px;
    }

    .card{
        background:#f3f3f3;
        border:2px solid #cfcfcf;
        height:250px;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        align-items:center;
        padding:20px;
        text-align:center;
    }

    .lista{
        font-size:55px;
        font-weight:bold;
    }

    .nombre{
        font-size:26px;
        font-weight:bold;
    }

    .sigla{
        font-size:24px;
    }

    .footer{
        margin-top:10px;
        display:flex;
        gap:10px;
    }

    .btn{
        background:#bdbdbd;
        padding:15px 20px;
        font-weight:bold;
        border-radius:5px;
    }
</style>
</head>

<body>

<div class="contenedor">

    <div class="titulo">
        Listas participantes al cargo de JUNTA MUNICIPAL
    </div>

    <div class="grid">

        <div class="card" onclick="window.location.href='p5.html'">
            <div class="lista">LISTA 2A</div>
            <div class="nombre">HONOR COLORADO A</div>
            <div class="sigla">MHC</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 2B</div>
            <div class="nombre">HONOR COLORADO B</div>
            <div class="sigla">MHC</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 4</div>
            <div class="nombre">FUERZA REPUBLICANA</div>
            <div class="sigla">MFR</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 6</div>
            <div class="nombre">COLORADO AÑETETE</div>
            <div class="sigla">MCA</div>
        </div>

        <div class="card">
            <div class="nombre" style="margin:auto;">
                VOTO EN BLANCO
            </div>
        </div>

    </div>

    <div class="footer">
        <div class="btn">Vista alto contraste</div>
        <div class="btn">Volver Atrás</div>
    </div>

</div>

</body>
</html>
