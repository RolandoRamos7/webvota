<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listas Participantes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#2d2d2d;
    padding:15px;
    display:flex;
    justify-content:center;
}

.contenedor{
    width:1100px;
    max-width:100%;
    margin:auto;
    background:#dcdcdc;
    padding:10px;
}

.titulo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:8px;
}

.card{
    background:#f3f3f3;
    border:2px solid #cfcfcf;
    min-height:250px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    text-align:center;
    cursor:pointer;
}

.lista{
    font-size:55px;
    font-weight:bold;
}

.nombre{
    font-size:26px;
    font-weight:bold;
}

.sigla{
    font-size:24px;
}

.footer{
    margin-top:10px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    background:#bdbdbd;
    padding:15px 20px;
    font-weight:bold;
    border-radius:5px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .titulo{
        font-size:22px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        min-height:200px;
        padding:15px;
    }

    .lista{
        font-size:42px;
    }

    .nombre{
        font-size:22px;
    }

    .sigla{
        font-size:20px;
    }

    .footer{
        flex-direction:column;
    }

    .btn{
        width:100%;
        text-align:center;
    }

}

</style>
</head>

<body>

<div class="contenedor">

    <div class="titulo">
        Listas participantes al cargo de JUNTA MUNICIPAL
    </div>

    <div class="grid">

        <div class="card" onclick="window.location.href='p5.html'">
            <div class="lista">LISTA 2A</div>
            <div class="nombre">HONOR COLORADO A</div>
            <div class="sigla">MHC</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 2B</div>
            <div class="nombre">HONOR COLORADO B</div>
            <div class="sigla">MHC</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 4</div>
            <div class="nombre">FUERZA REPUBLICANA</div>
            <div class="sigla">MFR</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 6</div>
            <div class="nombre">COLORADO AÑETETE</div>
            <div class="sigla">MCA</div>
        </div>

        <div class="card">
            <div class="nombre" style="margin:auto;">
                VOTO EN BLANCO
            </div>
        </div>

    </div>

    <div class="footer">
        <div class="btn">Vista alto contraste</div>
        <div class="btn">Volver Atrás</div>
    </div>

</div>

</body>
</html>
