<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listas Participantes</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background:#2b2b2b;
        padding:20px;
    }

    .container{
        max-width:1100px;
        margin:auto;
        background:#dcdcdc;
        border:2px solid #999;
    }

    .topbar{
        background:#5b5b5b;
        color:white;
        padding:10px;
        font-size:14px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .title{
        text-align:center;
        padding:20px 10px;
        background:#efefef;
        border-bottom:2px solid #c0c0c0;
    }

    .title h2{
        font-size:22px;
        margin-bottom:10px;
    }

    .title h1{
        font-size:52px;
        font-weight:bold;
        line-height:1.1;
    }

    .grid{
        display:grid;
        grid-template-columns:repeat(4, 1fr);
        gap:6px;
        padding:6px;
    }

    .card{
        background:#efefef;
        border:2px solid #d0d0d0;
        min-height:135px;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        padding:10px;
    }

    .card-top{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
    }

    .photo{
        width:85px;
        height:85px;
        background:#d7d7d7;
        border-radius:4px;
        overflow:hidden;
    }

    .photo img{
        width:100%;
        height:100%;
        object-fit:cover;
    }

    .option{
        font-size:26px;
        font-weight:bold;
        text-align:center;
        line-height:1.1;
    }

    .name{
        text-align:center;
        font-size:20px;
        margin-top:10px;
        color:#222;
    }

    .footer{
        display:flex;
        gap:10px;
        padding:10px;
        background:#cfcfcf;
    }

    .btn{
        background:#8a8a8a;
        color:white;
        padding:12px 18px;
        display:flex;
        align-items:center;
        gap:10px;
        font-weight:bold;
        border-radius:3px;
        cursor:pointer;
    }

    .btn:hover{
        background:#6f6f6f;
    }

    @media(max-width:900px){
        .grid{
            grid-template-columns:repeat(2, 1fr);
        }

        .title h1{
            font-size:38px;
        }
    }

    @media(max-width:600px){
        .grid{
            grid-template-columns:1fr;
        }

        .title h1{
            font-size:30px;
        }

        .option{
            font-size:22px;
        }
    }
</style>
</head>

<body>

<div class="contenedor">

    <div class="titulo">
        Listas participantes al cargo de JUNTA MUNICIPAL
    </div>

    <div class="grid">

        <div class="card" onclick="window.location.href='p5.html'">
            <div class="lista">LISTA 2A</div>
            <div class="nombre">HONOR COLORADO A</div>
            <div class="sigla">MHC</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 2B</div>
            <div class="nombre">HONOR COLORADO B</div>
            <div class="sigla">MHC</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 4</div>
            <div class="nombre">FUERZA REPUBLICANA</div>
            <div class="sigla">MFR</div>
        </div>

        <div class="card">
            <div class="lista">LISTA 6</div>
            <div class="nombre">COLORADO AÑETETE</div>
            <div class="sigla">MCA</div>
        </div>

        <div class="card">
            <div class="nombre" style="margin:auto;">
                VOTO EN BLANCO
            </div>
        </div>

    </div>

    <div class="footer">
        <div class="btn">Vista alto contraste</div>
        <div class="btn">Volver Atrás</div>
    </div>

</div>

</body>
</html>
