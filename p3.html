<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interfaz Elecciones</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#2b2b2b;
    overflow:hidden;
}

/* PANTALLA */
.pantalla{
    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* TABLERO */
.tablero{

    width:100vw;

    max-width:100%;

    background:#dcdcdc;

    border:2px solid #8a8a8a;

    transform:scale(1);

    transform-origin:center;
}

/* BARRA SUPERIOR */
.superior{

    background:#5a5a5a;

    color:white;

    font-size:11px;

    padding:5px 10px;

    text-align:center;

    font-weight:bold;
}

/* GRID */
.grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:4px;

    padding:4px;
}

/* CARD */
.card{

    background:#efefef;

    border:1px solid #bdbdbd;

    min-height:240px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:15px;
}

/* TITULO */
.titulo{

    font-size:20px;

    font-weight:bold;

    margin-bottom:18px;
}

/* IMAGEN */
.card img{

    width:85px;

    height:85px;

    object-fit:cover;

    margin-bottom:10px;
}

/* LISTA */
.lista{

    font-size:55px;

    font-weight:bold;

    line-height:1;
}

.sigla{

    font-size:22px;

    margin-bottom:10px;
}

/* NOMBRE */
.nombre{

    font-size:20px;
}

/* VOTO EN BLANCO */
.blanco{

    font-size:38px;

    font-weight:bold;
}

/* RESPONSIVE CELULAR */
@media(max-width:768px){

    .pantalla{

        justify-content:center;

        align-items:center;
    }

    .tablero{

        width:100vw;

        transform:scale(1);
    }

    .card{

        min-height:180px;

        padding:10px;
    }

    .titulo{

        font-size:14px;

        margin-bottom:10px;
    }

    .card img{

        width:55px;

        height:55px;

        margin-bottom:6px;
    }

    .lista{

        font-size:38px;
    }

    .sigla{

        font-size:15px;

        margin-bottom:6px;
    }

    .nombre{

        font-size:15px;
    }

    .blanco{

        font-size:24px;
    }

    .superior{

        font-size:8px;

        padding:4px;
    }

}

</style>
</head>

<body>

<div class="pantalla">

        </div>
