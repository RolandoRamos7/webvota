<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Máquina de Votación</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#1f1f1f;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

/* MAQUINA */

.maquina{
    width:100%;
    max-width:1200px;
    background:#4a4a4a;
    border-radius:20px;
    padding:20px;
    box-shadow:
    inset 0 0 15px rgba(255,255,255,0.1),
    0 0 25px rgba(0,0,0,0.8);
}

/* PANTALLA */

.pantalla{
    background:#dcdcdc;
    border:12px solid #2e2e2e;
    border-radius:15px;
    overflow:hidden;
}

/* HEADER */

.topbar{
    background:#3a3a3a;
    color:white;
    padding:15px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    letter-spacing:1px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:8px;
}

/* CARD */

.card{
    background:#f4f4f4;
    border:2px solid #cfcfcf;
    min-height:280px;
    padding:20px;
    cursor:pointer;
    transition:0.2s;
    position:relative;
}

.card:hover{
    transform:scale(1.01);
    border:2px solid #0b63ff;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card.selected{
    border:5px solid #00a651;
    background:#e9fff0;
}

/* PARTIDO */

.partido{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:25px;
}

/* CONTENIDO */

.contenido{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
}

.foto img{
    width:130px;
    height:150px;
    object-fit:cover;
    border:3px solid #cfcfcf;
}

/* LISTA */

.lista{
    text-align:center;
}

.lista h2{
    font-size:22px;
}

.numero{
    font-size:80px;
    font-weight:bold;
    line-height:80px;
}

.sigla{
    font-size:22px;
    margin-top:5px;
}

/* NOMBRE */

.nombre{
    text-align:center;
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

/* BLANCO */

.blanco{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:36px;
    font-weight:bold;
}

/* FOOTER */

.footer{
    background:#cfcfcf;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .contenido{
        flex-direction:column;
        gap:20px;
    }

    .topbar{
        font-size:22px;
    }

    .numero{
        font-size:60px;
    }

    .partido{
        font-size:20px;
    }

    .nombre{
        font-size:20px;
    }

}

</style>
</head>

<body>

<div class="maquina">

    <div class="pantalla">

        <div class="topbar">
            Candidatos a INTENDENTE MUNICIPAL
        </div>

        <div class="grid">

            <!-- CARD 1 -->
            <div class="card" onclick="seleccionar(this)">

                <div class="partido">
                    HONOR COLORADO
                </div>

                <div class="contenido">

                    <div class="foto">
                        <img src="https://simuladoroficial.tsje.gov.py/imagenes_candidaturas/paraguay_internas_municipales_2026/3878.25858.webp">
                    </div>

                    <div class="lista">
                        <h2>LISTA</h2>
                        <div class="numero">2</div>
                        <div class="sigla">MHC</div>
                    </div>

                </div>

                <div class="nombre">
                    Christian Rolon
                </div>

            </div>

            <!-- CARD 2 -->
            <div class="card" onclick="seleccionar(this)">

                <div class="partido">
                    FUERZA REPUBLICANA
                </div>

                <div class="contenido">

                    <div class="foto">
                        <img src="https://simuladoroficial.tsje.gov.py/imagenes_candidaturas/paraguay_internas_municipales_2026/3879.25859.webp">
                    </div>

                    <div class="lista">
                        <h2>LISTA</h2>
                        <div class="numero">4</div>
                        <div class="sigla">MFR</div>
                    </div>

                </div>

                <div class="nombre">
                    Gabriel Alfonzo
                </div>

            </div>

            <!-- CARD 3 -->
            <div class="card" onclick="seleccionar(this)">

                <div class="partido">
                    COLORADO AÑETETE
                </div>

                <div class="contenido">

                    <div class="foto">
                        <img src="https://simuladoroficial.tsje.gov.py/imagenes_candidaturas/paraguay_internas_municipales_2026/3880.25860.webp">
                    </div>

                    <div class="lista">
                        <h2>LISTA</h2>
                        <div class="numero">6</div>
                        <div class="sigla">MCA</div>
                    </div>

                </div>

                <div class="nombre">
                    Capitán Mutti
                </div>

            </div>

            <!-- CARD 4 -->
            <div class="card blanco" onclick="seleccionar(this)">
                VOTO EN BLANCO
            </div>

        </div>

        

    </div>

</div>

<script>

function seleccionar(card){

    // QUITAR SELECCION ANTERIOR
    let cards = document.querySelectorAll(".card");

    cards.forEach(c=>{
        c.classList.remove("selected");
    });

    // MARCAR SELECCION
    card.classList.add("selected");

    // ESPERA COMO MAQUINA REAL
    setTimeout(()=>{

        window.location.href = "p4.html";

    },700);

}

</script>

</body>
</html>
